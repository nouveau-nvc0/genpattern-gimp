name: Build & Release

on:
  push:
    tags: ['v*.*.*']

jobs:
  build-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Build dist
        run: python build.py

      - name: Pack archives
        run: |
          cd dist
          tar -czf genpattern-gimp.linux_x86_64.tar.gz -C linux_x86_64 genpattern
          tar -czf genpattern-gimp.linux_arm64.tar.gz -C linux_arm64 genpattern
          (cd windows_x86_64 && zip -r ../genpattern-gimp.windows_x64.zip genpattern)

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: "Release ${{ github.ref_name }}"
          body: "Automatically created release for ${{ github.ref_name }}"
          files: |
            dist/genpattern-gimp.linux_x86_64.tar.gz
            dist/genpattern-gimp.linux_arm64.tar.gz
            dist/genpattern-gimp.windows_x64.zip
